[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osa-analyzer"
version = "8.0.0"
description = "Optical spectrum analysis for fiber refractive-index sensors: resonance tracking, sensitivity fitting and leakage-safe RI regression."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TODO: Your Name", email = "joshu@graduate.utm.my" }]
keywords = ["optical spectrum analyzer", "fiber sensor", "refractive index",
            "multimode interference", "machine learning", "Yokogawa AQ6370"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "catboost>=1.2"]
deep = ["torch>=2.1"]
test = ["pytest>=8"]
all = ["xgboost>=2.0", "catboost>=1.2", "torch>=2.1", "pytest>=8"]

[project.scripts]
osa-analyzer = "osa_analyzer.cli:main"

[project.urls]
Repository = "https://github.com/JoshhhLee/Optical-Spectrum-Analyzer-Software"

[tool.setuptools.packages.find]
include = ["osa_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
